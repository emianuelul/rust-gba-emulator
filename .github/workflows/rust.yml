name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cd rust-emulator && cd rustlib && cargo build --verbose

  opcode-tests:

    runs-on: ubuntu-latest

    steps:
    - name: ARM Tests
      run: cd rust-emulator && cd rustlib && cargo test --lib cpu::arm_opcode_tests
    - name: THUMB Tests
      run: cd rust-emulator && cd rustlib && cargo test --lib cpu::thumb_opcode_tests
